# Merge this fragment into the configuration of your separate Frigate host.
# Replace ENTRANCE_IP and RTSP credentials privately; URL-encode credentials.
# These are the entrance's native RTSP credentials, not the gateway token.
# Confirm the stream path for your entrance. No HA bridge is required.
go2rtc:
  streams:
    comelit:
      - "rtsp://RTSP_USER:RTSP_PASSWORD@ENTRANCE_IP:554/live/h264/ch0"

cameras:
  comelit:
    ffmpeg:
      inputs:
        # 127.0.0.1 here is Frigate's own go2rtc restream, not Home Assistant.
        - path: rtsp://127.0.0.1:8554/comelit
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: false
      width: 320
      height: 240
      fps: 5
    record:
      enabled: false
