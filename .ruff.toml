# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"
# Preserve upstream formatting in the attributed vendor snapshot.
extend-exclude = ["custom_components/comelit_local/vendor"]

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
# Fixed protocol messages are intentionally kept next to their validation checks.
"custom_components/comelit_local/client.py" = ["EM101", "TRY003", "PLR2004", "N818"]
"custom_components/comelit_local/__init__.py" = ["EM101", "TRY003"]
# Temporary probe uses dynamically imported, revision-pinned reference types.
"experiments/video_probe.py" = ["ANN", "EM101", "TRY003", "PLR2004"]
"experiments/h264.py" = ["PLR2004"]
"custom_components/comelit_local/video.py" = ["EM101", "TRY003", "SLF001", "PLR2004"]
"tests/*" = ["ANN", "D", "S101", "S105", "S106", "PLR2004", "SLF001", "SIM117"]

# Inbound protocol adapter follows the same wire-level conventions as video.py.
"custom_components/comelit_local/call_transport.py" = ["EM101", "TRY003", "SLF001", "PLR2004"]
"custom_components/comelit_local/calls.py" = ["EM101", "TRY003", "SLF001", "PLR2004", "TRY301"]
"custom_components/comelit_local/call_api.py" = ["EM101", "TRY003"]
